<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Component</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .card {
        background: white;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 300px;
        overflow: hidden;
      }

      .card .img-placeholder {
        width: 100%;
        aspect-ratio: 16/9;
        background-color: #c9c9c9;
        object-fit: cover;
      }

      .card-body {
        padding: 20px;
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .card-text {
        font-size: 0.95rem;
        color: #555;
        margin-bottom: 15px;
      }

      .card-button {
        display: inline-block;
        padding: 10px 16px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.9rem;
      }

      .card-button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="img-placeholder"></div>
      <div class="card-body">
        <div class="card-title">Elegant Dining</div>
        <div class="card-text">
          Experience fine cuisine in a luxurious setting with curated
          ingredients.
        </div>
        <a href="#" class="card-button">Book Now</a>
      </div>
    </div>
  </body>
</html>
